<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chat frame</title>
<style>
  /* Like YouTube's live chat: the document itself never scrolls; the message list does. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: #1c1c1c; color: #ddd; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 6px 8px; border-bottom: 1px solid #333; font-weight: 600; }
  #item-scroller { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .msg { padding: 3px 0; display: flex; gap: 6px; align-items: center; }
  .msg b { color: #8cf; }
  .msg button { margin-left: auto; background: none; color: #888; border: 0; }
  footer { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid #333; }
  footer input { flex: 1; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 6px; }
  footer button { background: #3a3a3a; color: #fff; border: 0; border-radius: 4px; padding: 6px 10px; }
</style>
</head>
<body>
<header id="title">Live chat</header>
<div id="item-scroller"></div>
<footer><input placeholder="Say something"><button>Send</button></footer>
<script>
  // ?plain: messages have nothing focusable (the list can only be scrolled).
  // default: each message has a ⋮ menu button (the list is a container you can enter).
  const plain = new URLSearchParams(location.search).has('plain');
  document.getElementById('title').textContent = plain ? 'Live chat (no buttons in messages)' : 'Live chat (⋮ menu per message)';
  document.getElementById('item-scroller').innerHTML = Array.from({ length: 40 }, (_, i) =>
    `<div class="msg"><b>viewer${i + 1}</b><span>message ${i + 1}</span>${plain ? '' : `<button aria-label="Chat actions ${i + 1}">⋮</button>`}</div>`).join('');
  const s = document.getElementById('item-scroller');
  s.scrollTop = s.scrollHeight; // chat starts at the newest message
  // Forward keys to the test page's keyboard stand-in (see frame.html).
  for (const type of ['keydown', 'keyup']) addEventListener(type, (e) => {
    parent.postMessage({ test: 'key', type, code: e.code, altKey: e.altKey, ctrlKey: e.ctrlKey }, '*');
    const typing = document.activeElement?.matches('input');
    if (!typing && /^(Arrow|Page|Space)/.test(e.code)) e.preventDefault();
  }, true);
</script>
<script src="/extension/content.js"></script>
</body>
</html>
